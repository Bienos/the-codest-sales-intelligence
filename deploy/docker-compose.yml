# Reference topology: api + worker + scheduler + postgres. Secrets via files (never env literals, never the repo).
services:
  db:
    image: postgres:16
    environment: {POSTGRES_PASSWORD_FILE: /run/secrets/db_password, POSTGRES_DB: ri}
    secrets: [db_password]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U postgres -d ri"], interval: 5s, retries: 10}
  migrate:
    build: {context: .., dockerfile: Dockerfile}
    command: ["python", "-m", "ri.cli", "migrate"]
    env_file: .env.production
    depends_on: {db: {condition: service_healthy}}
  api:
    build: {context: .., dockerfile: Dockerfile}
    env_file: .env.production
    ports: ["8000:8000"]
    depends_on: {migrate: {condition: service_completed_successfully}}
    read_only: true
    tmpfs: [/tmp]
  worker:
    build: {context: .., dockerfile: Dockerfile}
    command: ["python", "-m", "ri.cli", "worker"]
    env_file: .env.production
    depends_on: {migrate: {condition: service_completed_successfully}}
  scheduler:
    build: {context: .., dockerfile: Dockerfile}
    entrypoint: ["sh", "-c", "while true; do python -m ri.cli schedule; sleep 300; done"]
    env_file: .env.production
    depends_on: {migrate: {condition: service_completed_successfully}}
secrets:
  db_password: {file: ./secrets/db_password}
volumes: {pgdata: {}}
