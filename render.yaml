# Render Blueprint: New > Blueprint > pick this repo/branch. Database is Supabase (external), so no Render Postgres.
# Every secret is `sync: false`: Render asks for it in the dashboard; nothing sensitive lives in git.
services:
  - type: web
    name: ri-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /readyz
    autoDeploy: false          # deploy deliberately, not on every push
    envVars: &common
      - {key: RI_ENV, value: production}
      - {key: RI_CRM_WRITES_ENABLED, value: "false"}
      - {key: RI_OUTBOUND_ENABLED, value: "false"}
      - {key: RI_PAID_ENRICHMENT_ENABLED, value: "false"}
      - {key: RI_AUTH_MODE, value: oidc}
      - {key: DATABASE_URL, sync: false}            # Supabase SESSION-pooler string
      - {key: RI_GOOGLE_CLIENT_ID, sync: false}      # Google OAuth Web client ID (public value)
      - {key: RI_ALLOWED_EMAIL_DOMAIN, value: thecodest.co}
      - {key: RI_BOOTSTRAP_ADMIN_EMAILS, sync: false} # comma-separated; created as admin by `ri.cli seed`
      - {key: GOOGLE_APPLICATION_CREDENTIALS, value: /etc/secrets/google_sa.json}   # upload as a Render Secret File
      - {key: EXA_API_KEY, sync: false}
      - {key: ANTHROPIC_API_KEY, sync: false}
      - {key: PIPEDRIVE_DOMAIN, value: thecodestltd}
      - {key: PIPEDRIVE_API_TOKEN, sync: false}
      - {key: PIPEDRIVE_WEBHOOK_SECRET, sync: false}
  - type: worker
    name: ri-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: python -m ri.cli worker
    autoDeploy: false
    envVars: *common
  - type: cron
    name: ri-scheduler
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: python -m ri.cli schedule
    schedule: "*/5 * * * *"
    envVars: *common
