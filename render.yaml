# Render Blueprint. Database is Supabase (external). Secrets live in ONE env group (ri-secrets) shared by all services;
# values are entered in the Render dashboard and never stored in git. Region matches Supabase (Frankfurt, EU data).
envVarGroups:
  - name: ri-secrets
    envVars:
      - {key: DATABASE_URL, sync: false}               # Supabase SESSION-pooler connection string
      - {key: RI_GOOGLE_CLIENT_ID, sync: false}        # Google OAuth Web client ID (public value)
      - {key: RI_BOOTSTRAP_ADMIN_EMAILS, sync: false}  # comma-separated; created as admin by `ri.cli seed`
      - {key: EXA_API_KEY, value: ""}                  # set later; paid use also needs a budget cap (default 0)
      - {key: ANTHROPIC_API_KEY, value: ""}            # set later
      - {key: PIPEDRIVE_API_TOKEN, value: ""}          # set later (read-only token)
      - {key: PIPEDRIVE_WEBHOOK_SECRET, value: ""}     # set later
      - {key: RI_SESSION_SECRET, generateValue: true}  # signs 12-hour sessions (renewable up to 7 days); without it people are signed out hourly
      - {key: LEMLIST_API_KEY, sync: false}              # set later: signal campaigns are pushed (not launched) and activity is read back hourly
      - {key: RI_LEMLIST_WEBHOOK_SECRET, sync: false}    # set later: long random string; register https://<app>/webhooks/lemlist/<secret> in Lemlist
      - {key: APOLLO_API_KEY, sync: false}               # set later: find decision makers; reveals need RI_PAID_ENRICHMENT_ENABLED, a price and approval
      - {key: SLACK_WEBHOOK_URL, sync: false}            # optional daily digest
services:
  - type: web
    name: ri-api
    runtime: docker
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /readyz
    autoDeploy: false          # deploy deliberately, not on every push
    envVars: &common
      - {key: RI_ENV, value: production}
      - {key: RI_CRM_WRITES_ENABLED, value: "false"}
      - {key: RI_OUTBOUND_ENABLED, value: "false"}
      - {key: RI_PAID_ENRICHMENT_ENABLED, value: "false"}
      - {key: RI_AUTH_MODE, value: oidc}
      - {key: RI_ALLOWED_EMAIL_DOMAIN, value: thecodest.co}
      - {key: RI_GOOGLE_REQUIRE_WORKSPACE, value: "false"}   # set "true" once confirmed that everyone signs in with a thecodest.co Google Workspace account
      - {key: RI_API_RATE_PER_MINUTE, value: "600"}           # per-caller API ceiling
      - {key: PIPEDRIVE_DOMAIN, value: thecodestltd}
      - {key: RI_EXA_MONTHLY_CAP_USD, value: "20"}                 # hard monthly cap for Exa (USD)
      - {key: RI_ANTHROPIC_MONTHLY_TOKEN_CAP, value: "10000000"}   # hard monthly cap on model tokens (about $1.60 at Haiku list price); raise deliberately
      - {key: RI_ANTHROPIC_MODEL, value: "claude-haiku-5-5"}      # model that reads pages; claude-sonnet-5-5 is more accurate at about 20x the price
      - {fromGroup: ri-secrets}
  - type: worker
    name: ri-worker
    runtime: docker
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerCommand: python -m ri.cli worker
    autoDeploy: false
    envVars: *common
  - type: cron
    name: ri-scheduler
    runtime: docker
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerCommand: python -m ri.cli schedule
    schedule: "*/5 * * * *"
    envVars: *common
