# Directory of every connection: what it is, what state it is in, what is needed to turn it on and where to get that.
# `state` here is only used when the source is NOT live; a live source is always shown as live.
# States: per_account | built_in | needs_address | blocked_by_site | needs_credential | not_built | deferred | needs_retest
connections:
  ats-greenhouse: {state: per_account, todo: "Press Scan on an account. The scan finds the account's Greenhouse board from its careers page and reads the open roles.", where: "Nothing to obtain: public job boards."}
  ats-lever: {state: per_account, todo: "Press Scan on an account. The scan finds the account's Lever board from its careers page.", where: "Nothing to obtain: public job boards."}
  ats-ashby: {state: per_account, todo: "Press Scan on an account. The scan finds the account's Ashby board from its careers page.", where: "Nothing to obtain: public job boards."}
  ats-workday: {state: not_built, todo: "Workday has no public postings API. Careers pages that allow it are read by the account scan; nothing else is planned.", where: "-"}
  attention-bitkom: {state: blocked_by_site, todo: "The site refuses automated reads. Needs permission from Bitkom or a licensed feed; do not work around it.", where: "Ask Bitkom's press office for a feed or written permission."}
  attention-techuk: {state: blocked_by_site, todo: "The site refuses automated reads. Needs permission from techUK or a licensed feed.", where: "Ask techUK's press office for a feed or written permission."}
  attention-fintechfutures: {state: blocked_by_site, todo: "The site refuses automated reads. Finextra, The Paypers and Fintech Times cover the same ground and are live.", where: "Ask FinTech Futures about a licensed feed."}
