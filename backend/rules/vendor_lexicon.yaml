# Who counts as which kind of supplier. Used by vendor intelligence (src/ri/research/vendor_intel.py) to give a supplier name one spelling and one
# category, whatever the page or the model called it, and to tell The Codest's direct competitors from platform vendors and integrators.
#
# ADVISORY, NEVER EVIDENCE. A name in this file proves nothing about any account: a vendor is only ever shown for an account when a page, an award
# notice or one of our own verified findings ties the two together. The file is matched by exact name or alias (never by part of a word), so a short
# alias such as "FIS" cannot match inside another word. Sales leadership can add names; a name not listed here is still found and shown, as "Other".
#
# categories:
#   core_platform       banking / insurance / wealth core systems and industry platforms
#   payments_platform   payments, cards, acquiring, payment infrastructure
#   digital_channels    mobile and web banking, onboarding journeys, customer experience
#   risk_compliance     fraud, AML, KYC, identity, credit data
#   data_ai             data platforms and AI model providers
#   cloud               cloud, infrastructure, observability
#   enterprise_apps     CRM, ERP, workflow, process automation
#   system_integrator   large integrators and consultancies (the route in via the prime, rules SRC-04 / NEG-03)
#   engineering_partner software engineering firms: The Codest's direct competitors for team extension and delivery teams
#   staffing_msp        staffing agencies and managed-service / vendor-management programmes (rule SRC-06)
categories:
  core_platform: "Core and industry platform"
  payments_platform: "Payments and cards"
  digital_channels: "Digital channels"
  risk_compliance: "Risk, fraud, identity and compliance"
  data_ai: "Data and AI platform"
  cloud: "Cloud and infrastructure"
  enterprise_apps: "CRM, ERP and workflow"
  system_integrator: "Systems integrator or consultancy"
  engineering_partner: "Software engineering partner"
  staffing_msp: "Staffing or contingent labour"
  other: "Other supplier"

