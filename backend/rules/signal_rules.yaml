# Executable extension of the ORIGINAL 64-rule tracker (reference/signals/*.csv is never modified).
# Only rules listed here with status: active have validated detectors. All other legacy IDs are imported as
# defined_not_activated and cannot fire until a detector + fixtures (>=3 pos, >=3 neg, >=2 ambiguous, >=1 expiry) exist.
# Predicate leaves: {attr: <name>, <op>: <value>}   ops: eq in not_in gte lte exists is_true is_false contains_any days_since_in
# Special attrs: summary, event_type, other_roles (roles of other named entities), employment_type, tech_keywords ...
rules:
  - id: SRC-01
    version: 1.0.0
    status: active
    kind: signal
    required_event_types: [procurement_published, procurement_amended]
    source_tiers: [S1]
    required_fields: [buyer_entity, scope, authoritative_url, submission_deadline, notice_status]
    match: {all: [{attr: notice_status, in: [open, amended]}, {attr: relevant_services, is_true: true}]}
    exclusions: []
    demand_tier: D1
    strength: 3
    min_verification: verified
    expiry: {mode: official_close, field: submission_deadline}
    reason_code: live_relevant_tender
    commercial_questions: ["Is The Codest eligible, alone or in a consortium?", "Are technical scope, certifications, location and contract terms feasible?"]
    related_play: SP-09
    buyer_roles: [technical_sponsor, procurement_owner]
    negative_rules: [NEG-05, NEG-12]
  - id: SRC-02
    version: 1.0.0
    status: active
    kind: signal
    required_event_types: [supplier_panel_opened]
    source_tiers: [S1, S2, S3]
    required_fields: [authoritative_url]
    match: {all: [{attr: panel_open_for_applications, is_true: true}, {attr: it_services_scope, is_true: true}]}
    exclusions: [{attr: panel_closed, is_true: true}]
    demand_tier: D2
    strength: 1
    min_verification: verified
    expiry: {mode: days, days: 90}
    reason_code: supplier_route_opening
    commercial_questions: ["Which category, lot and entity does the panel cover?", "What eligibility and security preflight is required?"]
    related_play: SP-09
    buyer_roles: [procurement_owner, technical_sponsor]
  - id: SRC-04
    version: 1.0.0
    status: active
    kind: signal
    required_event_types: [vendor_selected, programme_announced, procurement_awarded, implementation_launched]
    source_tiers: [S1, S2, S3]
    required_fields: []
    match: {all: [{attr: award_scope_includes_dev, is_true: true}, {attr: other_roles, contains_any: [si, prime, integrator, systems_integrator]}]}
    exclusions: [{attr: programme_status, in: [cancelled, completed]}]
    demand_tier: D3
    upgrade_with_independent_groups: {min: 2, to: D2}
    strength: 2
    min_verification: verified
    expiry: {mode: days, days: 120}
    reason_code: prime_award_partner_route
    commercial_questions: ["Which workstreams remain outside the prime's scope?", "Does the prime run a specialist-subcontracting route and what are its eligibility rules?"]
    related_play: SP-08
    buyer_roles: [partner_delivery, alliance_lead]
    negative_rules: [NEG-03]
  - id: SRC-05
    version: 1.0.0
    status: active
    kind: signal
    required_event_types: [vendor_selected, implementation_launched]
    source_tiers: [S1, S2, S3]
    required_fields: []
    match: {all: [{attr: counterparty_selected, is_true: true}, {any: [{attr: other_roles, contains_any: [vendor, technology_provider, core_banking_vendor, payments_vendor]}, {attr: role_of_subject, eq: vendor}]}]}
    exclusions: [{attr: programme_status, in: [cancelled, completed]}]
    demand_tier: D3
    upgrade_with_independent_groups: {min: 2, to: D2}
    strength: 2
    min_verification: verified
    expiry: {mode: days, days: 120}
    reason_code: vendor_implementation_signed
    commercial_questions: ["Is implementation owned by the vendor, the bank or an integrator?", "Does the vendor need external implementation capacity?"]
    related_play: SP-05
    buyer_roles: [partner_delivery, transformation_director]
  - id: SRC-06
    version: 1.0.0
    status: active
    kind: signal
    required_event_types: [procurement_published, supplier_panel_opened]
    source_tiers: [S1, S2, S3]
    required_fields: [authoritative_url]
    match: {all: [{attr: contingent_labour_call, is_true: true}]}
    exclusions: [{attr: notice_status, in: [expired, awarded, cancelled]}]
    demand_tier: D1
    strength: 3
    min_verification: verified
    expiry: {mode: days, days: 21}
    reason_code: contingent_labour_requisition
    commercial_questions: ["Is the requisition open to an external supplier or only to incumbent agencies?", "Do labour-leasing licences apply in this jurisdiction?"]
    related_play: SP-01
    buyer_roles: [delivery_director, procurement_owner]
  - id: CAP-01
    version: 1.0.0
    status: active
    kind: cluster
    required_event_types: [engineering_job_opened, contractor_job_opened]
    source_tiers: [S2]
    required_fields: [title]
    match: {all: [{attr: open_status, eq: open}]}
    exclusions: []
    cluster: {group_by: [subject_org_id, team], min_count: 3, window_days: 45}
    demand_tier: D3
    strength: 2
    min_verification: verified
    expiry: {mode: days, days: 45}
    reason_code: engineering_hiring_cluster
    commercial_questions: ["Is this insourcing or external capacity?", "Which programme or product do the roles serve?"]
    related_play: SP-02
    buyer_roles: [engineering_director, programme_owner]
    negative_rules: [NEG-02]
  - id: CAP-02
    version: 1.0.0
    status: active
    kind: signal
    required_event_types: [contractor_job_opened]
    source_tiers: [S2]
    required_fields: [title, employment_type, tech_keywords]
    match: {all: [{attr: employment_type, in: [contract, interim, freelance]}, {attr: tech_keywords, exists: true}, {attr: open_status, eq: open}]}
    exclusions: []
    demand_tier: D2
    strength: 3
    min_verification: verified
    expiry: {mode: vacancy_closure, days: 30}
    reason_code: contract_role_on_named_system
    commercial_questions: ["Is the role open to supplier/agency engagement or direct freelancers only?", "What is the named system and programme?"]
    related_play: SP-01
    buyer_roles: [engineering_director, delivery_director]
  - id: CAP-03
    version: 1.0.0
    status: active
    kind: signal
    required_event_types: [job_hard_to_fill]
    source_tiers: [S2]
    required_fields: [title]
    # made by the daily lane hard_to_fill_roles (src/ri/signals/hiring.py) from stored job ads: still listed after 60+ days, or posted again after an earlier ad closed
    match: {all: [{attr: open_status, eq: open}, {any: [{attr: days_open, gte: 60}, {attr: reposted, is_true: true}]}]}
    exclusions: [{attr: title, contains_any: [intern, internship, working student, werkstudent, trainee, praktikum, talent pool, talent community, open application, general application, spontaneous application, initiativbewerbung]}]
    demand_tier: D3
    strength: 1
    min_verification: verified
    expiry: {mode: vacancy_closure, days: 30}
    reason_code: hard_to_fill_role
    commercial_questions: ["Is the role still unfilled because the skill is scarce, or because the budget or scope changed?", "Would they take an external engineer for it while they keep looking?"]
    related_play: SP-01
    buyer_roles: [engineering_manager, engineering_director]
    negative_rules: [NEG-02]
  - id: CAP-04
    version: 1.0.0
    status: active
    kind: cluster
    required_event_types: [engineering_job_opened, contractor_job_opened]
    source_tiers: [S2]
    required_fields: [title]
    # the stacks where we hold proof (rules/codest_capabilities.yaml); one ad alone is weak, so it takes two at one company within 45 days
    match: {all: [{attr: open_status, eq: open}, {any: [{attr: tech_keywords, contains_any: [ruby on rails, rails, python, java, react, vue, typescript, aws]}, {attr: title, contains_any: [ruby, rails, python, java, react, vue, typescript, aws]}]}]}
    exclusions: [{attr: title, contains_any: [intern, internship, working student, werkstudent, trainee, praktikum]}]
    cluster: {group_by: [subject_org_id], min_count: 2, window_days: 45, count_matching: true}
    demand_tier: D3
    strength: 2
    min_verification: verified
    expiry: {mode: days, days: 45}
    reason_code: hiring_in_our_stack
    commercial_questions: ["Which team and product are the roles for?", "Would engineers who already work in this stack shorten the wait for hires?"]
    related_play: SP-01
    buyer_roles: [engineering_director, discipline_lead]
    negative_rules: [NEG-02]
  - id: CAP-05
    version: 1.0.0
    status: active
    kind: signal
    required_event_types: [engineering_job_opened, contractor_job_opened]
    source_tiers: [S2]
    required_fields: [title]
    match: {all: [{any: [{attr: title, contains_any: [llm, rag, mlops, ml ops, ai agent, agentic, machine learning engineer, genai]}, {attr: tech_keywords, contains_any: [llm, rag, mlops, langchain]}]}, {attr: open_status, eq: open}]}
