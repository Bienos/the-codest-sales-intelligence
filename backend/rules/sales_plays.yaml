# Sales play catalogue (spec 08 §6). Wording here is an INTERNAL working draft: approved external wording and proof must
# come from marketing-approved assets (proof_assets). Nothing here may name a client or quote a metric.
plays:
  - {id: SP-01, name: Specialist capacity, triggers: {rules: [CAP-02, SRC-06]}, primary_buyer: Engineering/Delivery Director, objective: "Role, duration, budget route, eligibility", proof_tags: [staffing, python, java], questions: ["Which named system and which team does the role serve?", "Is the role open to supplier engagement or direct hire only?", "How long is the engagement expected to run?"], disqualifiers: [labour_leasing_licence_required, no_external_contingent_labour]}
  - {id: SP-02, name: Embedded team, triggers: {rules: [CAP-01, PRG-16]}, primary_buyer: VP Engineering / PMO, objective: "Capacity, operating model, ownership", proof_tags: [embedded_team], questions: ["Is the hiring cluster insourcing, or is external capacity part of the plan?", "Who owns the delivery model?"], disqualifiers: [nearshore_hub_covers_scope, hiring_freeze]}
  - {id: SP-03, name: Defined workstream, triggers: {rules: [PRG-03, PRG-04, PRG-08, PRG-11], domains: [api_platform]}, primary_buyer: Product/Programme Owner, objective: "Deliverables, acceptance criteria, schedule", proof_tags: [workstream_delivery], questions: ["Which deliverables are separable from the platform vendor scope?", "How is acceptance defined?"], disqualifiers: [scope_fully_allocated]}
  - {id: SP-04, name: Payment integration, triggers: {rules: [PRG-06]}, primary_buyer: Payments Engineering Head, objective: "API, compliance, testing/implementation scope", proof_tags: [payments, iso20022], questions: ["Which scheme/rail and certification window applies to which entity?", "Who owns integration testing?"], disqualifiers: [scheme_certification_held_by_vendor_only]}
  - {id: SP-05, name: Banking modernisation, triggers: {rules: [PRG-01, SRC-05]}, primary_buyer: Transformation Director / SI, objective: "Separable workstream + purchase route", proof_tags: [banking_domain, java], questions: ["Which workstreams sit outside the platform vendor and the integrator scope?", "Is implementation allocated to your current SI or sourced separately?"], disqualifiers: [si_contract_covers_scope]}
  - {id: SP-06, name: Cloud/data, triggers: {rules: [PRG-02]}, primary_buyer: Platform/Data Director, objective: "Technical constraint and milestone", proof_tags: [aws, data], questions: ["Which domains and dates are in scope?", "Who owns migration capacity?"], disqualifiers: [hyperscaler_funded_partner_only]}
  - {id: SP-07, name: AI implementation, triggers: {rules: [CAP-05, PRG-10], domains: [ai_use_case]}, primary_buyer: Business/AI owner, objective: "Business outcome, data, evaluation plan", proof_tags: [llm, python], questions: ["What business outcome and evaluation plan define success?", "Is delivery in-house or partner-led?"], disqualifiers: [no_data_access]}
  - {id: SP-08, name: Partner subcontract, triggers: {rules: [SRC-04]}, primary_buyer: Partner Delivery/Alliance, objective: "Partner eligibility and specialist gap", proof_tags: [partner_delivery], questions: ["Which specialist gaps does the prime plan to fill externally?", "What are the partner onboarding and eligibility requirements?"], disqualifiers: [prime_has_closed_supplier_list]}
  - {id: SP-09, name: Supplier entry, triggers: {rules: [SRC-01, SRC-02, SRC-03]}, primary_buyer: Procurement + technical sponsor, objective: "Eligibility, timeline and category", proof_tags: [supplier_preflight], questions: ["Which lot/category and contracting entity apply?", "What security and eligibility preflight is required?"], disqualifiers: [ineligible_jurisdiction, certification_missing]}
  - {id: SP-10, name: Re-engagement, triggers: {rules: [REL-03]}, primary_buyer: Former sponsor / current owner, objective: "Whether need or timing changed", proof_tags: [], questions: ["Has anything changed in how this work is sourced since we last spoke?"], disqualifiers: [contact_suppressed, owned_elsewhere]}
