[project]
name = "codest-revenue-intelligence"
version = "0.1.0"
description = "The Codest Revenue Intelligence Platform - backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "psycopg[binary,pool]>=3.2",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pyyaml>=6",
  "rapidfuzz>=3.9",
  "pyjwt[crypto]>=2.8",
  "openpyxl>=3.1",
  "python-multipart>=0.0.9",
  "defusedxml>=0.7",              # openpyxl uses it automatically: blocks XML entity expansion in uploaded workbooks
  "numpy>=1.26",                  # the revenue forecast's simulation (ri/forecast)
]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10", "types-PyYAML"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: needs PostgreSQL (TEST_DATABASE_URL)"]

[tool.ruff]
line-length = 110
src = ["src"]
[tool.ruff.lint]
select = ["E","F","I","B","UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# pytest fixtures are shared by importing them from other test modules, which looks unused (F401) or redefined (F811) to the linter;
# tests also keep results they only inspect in a debugger (F841) and assert broad exceptions on purpose (B017). Source code stays strict.
"tests/**" = ["F401", "F811", "F841", "B017"]
